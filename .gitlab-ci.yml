stages:
  - mirror

# Mirror the develop branch to GitHub after every merge.
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   GITHUB_TOKEN    - GitHub personal access token with "repo" scope
#   GITHUB_REPO     - GitHub repository path, e.g. "myuser/my-repo" (no https://, no .git)
#
# The GitHub repo is a public read-only mirror of this GitLab repository.
# Contributors should open Merge Requests here on GitLab, not on GitHub.

mirror_develop_to_github:
  stage: mirror
  image: alpine:latest
  variables:
    # Fetch the full history — shallow clones cannot be pushed to an external remote.
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - apk add --no-cache git
    - git remote remove github || true
    - git remote add github "https://oauth2:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    - git checkout -B develop
    - git push --force github develop
    - git push --force github --tags

# ---------------------------------------------------------------------------
# prj.conf - Project Configuration File
# ---------------------------------------------------------------------------
# This file sets Kconfig options for the build. Every line here overrides the
# default value defined in a Kconfig file. The CONFIG_ prefix maps directly
# to the Kconfig symbol name.
#
# TIP: Run "west build -t menuconfig" to explore ALL available options
# in an interactive menu (requires the 'menuconfig' package).
# ---------------------------------------------------------------------------

# --- Hardware drivers ---
# Enable the GPIO subsystem (required to control LED pins)
CONFIG_GPIO=y

# --- Console / serial output ---
# Enable the serial (UART) driver so we can see printf/printk output
CONFIG_SERIAL=y
# Enable printk(), Zephyr's lightweight kernel-level print function
CONFIG_PRINTK=y

# --- Logging subsystem ---
# Enable Zephyr's structured logging framework (used by LOG_INF, LOG_ERR, etc.)
CONFIG_LOG=y

# --- Application-specific options (defined in our Kconfig file) ---
# Enable the Hello LED configuration block
CONFIG_HELLO_LED=y
# Blink every 1000 ms (1 second). Try changing this to 200 for fast blink!
CONFIG_HELLO_LED_BLINK_INTERVAL_MS=1000
# GPIO pin where the LED is connected
CONFIG_HELLO_LED_GPIO_PIN=14
# Enable log messages showing LED state on each toggle
CONFIG_HELLO_LED_LOG_ENABLED=y

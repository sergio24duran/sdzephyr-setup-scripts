# ---------------------------------------------------------------------------
# prj.conf - Multithreaded LED Example Configuration
# ---------------------------------------------------------------------------
# This file sets Kconfig options for the build. Experiment by changing
# values here and rebuilding to see different behaviors!
# ---------------------------------------------------------------------------

# --- Hardware drivers ---
CONFIG_GPIO=y

# --- Console output ---
CONFIG_SERIAL=y
CONFIG_PRINTK=y

# --- Logging subsystem ---
CONFIG_LOG=y

# --- Thread debugging (optional but educational) ---
# Enable thread name tracking (visible in debuggers and logging)
CONFIG_THREAD_NAME=y

# --- Application-specific options (see our Kconfig file) ---
CONFIG_MULTITHREAD_LEDS=y

# Stack size for LED threads
CONFIG_LED_THREAD_STACK_SIZE=1024

# Thread priorities (lower number = higher priority)
# LED A has higher priority (5) than LED B (7)
CONFIG_LED_A_PRIORITY=5
CONFIG_LED_B_PRIORITY=7

# Blink intervals - different values so you can see independent operation
CONFIG_LED_A_BLINK_INTERVAL_MS=500
CONFIG_LED_B_BLINK_INTERVAL_MS=1000

# GPIO pins
CONFIG_LED_A_GPIO_PIN=14
CONFIG_LED_B_GPIO_PIN=18

# Enable semaphore synchronization demo
CONFIG_LED_SYNC_ENABLED=y
